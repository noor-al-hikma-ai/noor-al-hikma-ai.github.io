name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compiler tests (CaseSpine examples, Arabic ≡ English, palette edits, .csar)
        run: npm test
      - run: node scripts/test-compliance.mjs
      - run: npm run build
        env:
          VITE_COMPLIANCE_ENDPOINT: ${{ vars.VITE_COMPLIANCE_ENDPOINT }}
          VITE_CASESPINE_INTENT_ENDPOINT: ${{ vars.VITE_CASESPINE_INTENT_ENDPOINT }}
          VITE_CASESPINE_NEXT_STEP_ENDPOINT: ${{ vars.VITE_CASESPINE_NEXT_STEP_ENDPOINT }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
